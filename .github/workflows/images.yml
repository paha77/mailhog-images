name: MailHog images
on:
  pull_request:
  push:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mailhog-images-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false
jobs:
  resolve:
    name: Resolve latest stable MailHog release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.MAILHOG_VERSION }}
      commit: ${{ steps.release.outputs.MAILHOG_COMMIT }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: release
        run: sh scripts/resolve-release.sh >> "$GITHUB_OUTPUT"
  build:
    needs: resolve
    name: Build and test (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64
      - name: Build and validate
        env:
          MAILHOG_VERSION: ${{ needs.resolve.outputs.version }}
          MAILHOG_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          printf 'MAILHOG_VERSION=%s\nMAILHOG_COMMIT=%s\n' "$MAILHOG_VERSION" "$MAILHOG_COMMIT" > "$RUNNER_TEMP/mailhog-release.env"
          MAILHOG_RELEASE_FILE="$RUNNER_TEMP/mailhog-release.env" sh scripts/build.sh '${{ matrix.arch }}'
      - name: Save validated image
        run: |
          set -euo pipefail
          mkdir -p image-artifacts
          docker save 'local/mailhog:${{ matrix.arch }}' | gzip -1 > 'image-artifacts/mailhog-${{ matrix.arch }}.tar.gz'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.arch }}
          path: image-artifacts/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
  publish:
    name: Docker push
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*
          merge-multiple: true
          path: image-artifacts
      - name: Load both validated images before login
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker load --input "image-artifacts/mailhog-$arch.tar.gz"
            test "$(docker image inspect --format '{{.Architecture}}' "local/mailhog:$arch")" = "$arch"
          done
          # Fetch the manifest validator before credentials are available.
          docker pull ghcr.io/jqlang/jq:1.8.1
      - name: Authenticate and publish
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'paha77' }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'mailhog-arm64v8' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          trap 'docker logout >/dev/null 2>&1' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          sh scripts/publish.sh
